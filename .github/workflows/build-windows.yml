name: Build SpliceReport (Windows desktop)

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows.yml"
      # Also rebuild when the engine or the custom component change, so
      # the bundled fallback in the exe stays current.
      - "splicereportmatchexfo.py"
      - "components/otdr_settings/**"

permissions:
  contents: write   # required to publish / update the GitHub Release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchain pins.  See desktop/SpliceReport.spec top-of-file
      #    comment block for WHY each pin matters.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Upgrade pip + wheel
        run: |
          python -m pip install --upgrade pip wheel

      - name: Install desktop requirements
        run: |
          pip install -r requirements-desktop.txt

      - name: Re-pin setuptools 65.5.1 LAST so it wins
        run: |
          pip install --force-reinstall "setuptools==65.5.1"

      - name: PyInstaller build
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist)  { Remove-Item -Recurse -Force dist  }
          pyinstaller SpliceReport.spec --noconfirm --clean

      # ── BOOT SELF-TEST ─────────────────────────────────────────────
      # A green PyInstaller build tells us nothing about whether the
      # exe launches.  Launch it, poll /_stcore/health, kill, and FAIL
      # this step if it never served — that way a DOA build can never
      # reach the Release page.
      - name: Boot self-test (launch exe, poll /_stcore/health)
        shell: pwsh
        run: |
          $exe = "dist\SpliceReport\SpliceReport.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "BOOT SELF-TEST FAILED — $exe missing after PyInstaller build."
            exit 1
          }

          $out = "boot_out.txt"
          $err = "boot_err.txt"
          # Remove stale files so we only show this run's diagnostics.
          Remove-Item $out,$err -ErrorAction SilentlyContinue

          Write-Host "Launching $exe ..."
          $proc = Start-Process -FilePath $exe `
                                 -PassThru `
                                 -RedirectStandardOutput $out `
                                 -RedirectStandardError  $err

          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {     # 45 * 2s ≈ 90s
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              Write-Host "Process exited early with code $($proc.ExitCode)."
              break
            }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" `
                                      -UseBasicParsing -TimeoutSec 2
              if ($r.Content.Trim() -eq "ok") {
                $ok = $true
                Write-Host ("Health = ok after ~{0}s." -f (($i + 1) * 2))
                break
              }
            } catch {
              # Server not up yet — keep polling.
            }
          }

          # Kill the server regardless of result.
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          # Also reap the in-process Streamlit subprocess (if any).
          Get-Process -Name "SpliceReport" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          Write-Host "----- boot_out.txt -----"
          Get-Content $out -ErrorAction SilentlyContinue
          Write-Host "----- boot_err.txt -----"
          Get-Content $err -ErrorAction SilentlyContinue

          # Also dump the launcher's log so any traceback inside the
          # frozen process is visible in CI.
          $log = Join-Path $env:USERPROFILE ".spliceReport\spliceReport.log"
          if (Test-Path $log) {
            Write-Host "----- spliceReport.log -----"
            Get-Content $log -ErrorAction SilentlyContinue
          }

          if (-not $ok) {
            Write-Error "BOOT SELF-TEST FAILED — exe never returned /_stcore/health = ok within 90s.  Release will NOT be updated."
            exit 1
          }
          Write-Host "BOOT SELF-TEST PASSED."

      - name: Zip the dist folder
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\SpliceReport\*" `
                            -DestinationPath "dist\SpliceReport-Windows.zip" `
                            -Force

      - name: Upload artifact (always — for debugging too)
        uses: actions/upload-artifact@v4
        with:
          name: SpliceReport-Windows
          path: desktop/dist/SpliceReport-Windows.zip
          retention-days: 14

      # ── Publish / update the permanent Release ────────────────────
      # We only reach this step if the boot self-test passed (failed
      # steps abort the job).  The release tag `windows-build` is
      # permanent — the download URL never changes, only the artifact
      # behind it.
      - name: Publish to permanent Release (windows-build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag   = "windows-build"
          $title = "Splice Report — Windows desktop build"
          $notes = "Permanent build link.  This release is rewritten by CI on every successful boot self-test."
          # Create the release once; subsequent runs `upload --clobber`.
          gh release create $tag --title $title --notes $notes --latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists; continuing to upload."
          }
          gh release upload $tag "dist\SpliceReport-Windows.zip" --clobber
